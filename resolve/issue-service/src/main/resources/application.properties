spring.datasource.url=jdbc:postgresql://ep-damp-shape-b3r1oc3v-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_RSG3lPWpY8vE
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Connection Pool (HikariCP)
# ========================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ========================
# Service Identity
# ========================
server.port=8082
spring.application.name=ISSUE-SERVICE

# ========================
# Eureka Registration
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# ========================
# OpenFeign
# ========================
spring.cloud.openfeign.circuitbreaker.enabled=true

# ========================
# SLA & Prediction Engine (Python Service)
# ========================
sla.service.url=http://127.0.0.1:8002
sla.service.token=univ-resolve-sla-secret-token
